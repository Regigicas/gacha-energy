<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gacha Stamina Calculator</title>
  <meta name="description" content="Track stamina replenishment across multiple gacha games at once." />

  <!-- Defence in depth: nothing inline, nothing third-party, no framing, no
       form posts. Note that frame-ancestors is ignored in a <meta> CSP. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />

  <!-- PWA: web app manifest + theme -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d0f1a" />
  <meta name="color-scheme" content="dark" />

  <!-- Icons (Android / Windows / general) -->
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />

  <!-- Apple (iOS / iPadOS / macOS Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gacha Stamina" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- Link previews: crawlers need absolute URLs. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://regigicas.github.io/gacha-energy/" />
  <meta property="og:title" content="Gacha Stamina Calculator" />
  <meta property="og:description" content="Track stamina replenishment across multiple gacha games at once." />
  <meta property="og:image" content="https://regigicas.github.io/gacha-energy/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="modulepreload" href="stamina.js" />
  <script type="module" src="app.js"></script>
</head>

<body>

  <header class="page-header">
    <div class="page-title">
      <img class="icon" src="icons/icon-192.png" width="192" height="192" alt="" />
      <h1 class="gradient-text">Gacha Stamina Calculator</h1>
    </div>
    <div class="presets-wrap" id="presetsWrap">
      <button type="button" class="btn-primary btn-small js-add" id="addGameBtn"><span aria-hidden="true">＋</span> Add Game</button>
      <!-- Preset buttons injected here -->
    </div>
  </header>

  <main class="games">
    <div class="games-grid" id="gamesGrid">
      <!-- Cards injected here -->
    </div>
    <noscript>
      <p class="noscript">This calculator needs JavaScript enabled.</p>
    </noscript>
  </main>

  <footer class="page-footer">
    <div class="footer-tools">
      <button type="button" class="btn-secondary btn-small" id="exportBtn">Export</button>
      <button type="button" class="btn-secondary btn-small" id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden />
      <button type="button" class="btn-secondary btn-small" id="notifyBtn" aria-pressed="false"
        title="Get a notification when a game's stamina is full, while the app is running in the background" hidden>
        <span aria-hidden="true">🔔</span> Notify when full
      </button>
    </div>
    <a class="github-link" href="https://github.com/Regigicas/gacha-energy" target="_blank" rel="noopener noreferrer"
      aria-label="View source on GitHub">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
      </svg>
    </a>
  </footer>

  <!-- Always in the DOM so screen readers pick up changes to it. -->
  <div class="toast" id="toast" role="status">
    <span id="toastText"></span>
    <button type="button" class="toast-btn" id="toastAction" hidden></button>
  </div>

  <!-- Card markup lives here so no user-supplied value is ever interpolated
       into an HTML string; values are assigned through .value / .textContent. -->
  <template id="cardTemplate">
    <article class="game-card" tabindex="-1">
      <div class="card-header">
        <input class="game-name-input js-name" type="text" placeholder="Game name…" aria-label="Game name"
          maxlength="120" autocomplete="off" />
        <div class="card-actions">
          <button type="button" class="icon-btn js-prev" aria-label="Move earlier" title="Move earlier">‹</button>
          <button type="button" class="icon-btn js-next" aria-label="Move later" title="Move later">›</button>
          <button type="button" class="icon-btn is-danger js-remove" aria-label="Remove game"
            title="Remove game">✕</button>
        </div>
      </div>

      <!-- Each <label> wraps its input, so no id/for pairing is needed. -->
      <div class="fields">
        <label class="field">
          <span class="label">Current</span>
          <input data-field="cur" type="number" min="0" step="any" inputmode="decimal" />
        </label>
        <label class="field">
          <span class="label">Max</span>
          <input data-field="max" type="number" min="1" step="any" inputmode="decimal" />
        </label>
        <label class="field">
          <span class="label">Min per point</span>
          <input data-field="regen" type="number" min="0.1" step="any" inputmode="decimal"
            title="Minutes it takes to regenerate 1 stamina" />
        </label>
        <label class="field">
          <span class="label">Target</span>
          <input data-field="target" type="number" min="1" step="any" inputmode="decimal" placeholder="Optional"
            title="Also show when stamina reaches this amount" />
        </label>
      </div>
      <p class="error-msg js-err" role="alert"></p>

      <div class="js-bar-wrap" hidden>
        <div class="bar-label label">
          <span>Stamina</span>
          <span class="js-bar-text">0%</span>
        </div>
        <div class="bar-track js-bar" role="progressbar" aria-label="Stamina" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="0">
          <div class="bar-fill js-bar-fill"></div>
        </div>
      </div>

      <div class="result js-result" hidden>
        <p class="full-message js-full-msg" hidden></p>
        <div class="result-grid js-grid">
          <div class="result-card">
            <div class="label">Time Remaining</div>
            <div class="rc-value gradient-text js-time-rem">—</div>
            <div class="rc-sub js-time-rem-sub"></div>
          </div>
          <div class="result-card">
            <div class="label">Full At</div>
            <div class="rc-value gradient-text js-full-at">—</div>
            <div class="rc-sub js-full-at-sub"></div>
          </div>
        </div>
        <p class="target-line js-target" hidden></p>
      </div>
    </article>
  </template>

</body>

</html>
